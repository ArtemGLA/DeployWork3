name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]

jobs:
  RunMake:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ make
      
      - name: Build program
        working-directory: ./src
        run: |
          make bin
          make install
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-program
          path: usr/bin/hello
          retention-days: 1

  RunTest:
    needs: RunMake
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/download-artifact@v4
        with:
          name: built-program
          path: ./usr/bin
      
      - name: Compile and run tests
        run: |
          make -C ./cicd

  RunPackage:
    needs: RunTest
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: built-program
          path: ./usr/bin
      
      - name: Build .deb package
        run: |
          dpkg-deb --build . ItalianCode.deb
      
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: ItalianCode.deb
          retention-days: 1

  test-docker:
    needs: RunPackage
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download deb package
        uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: .
      
      - name: Build Docker image
        run: docker build -t myapp-test .
      
      - name: Test program with input data
        run: |
          # Создаем файл с входными данными
          cat > input.txt << 'EOF'
          1
          10
