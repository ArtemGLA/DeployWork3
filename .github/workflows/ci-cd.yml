          16
          EOF
          
          echo "=== Запуск программы с тестовыми данными ==="
          cat input.txt | docker run -i --rm myapp-test > output.txt
          
          echo "=== Вывод программы ==="
          cat output.txt
          
          echo "=== Тест завершен ==="
