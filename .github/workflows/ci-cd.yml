name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]

jobs:
  test-docker:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Build Docker image
        run: docker build -t myapp-test .
      
      - name: Test program with input data
        run: |
          # Создаем файл с входными данными
          cat > input.txt << 'EOF'
          1
          10
          10
          10
          6
          10
          2
          10
          7
          10
          10
          10
          3
          10
          10
          10
          8
          10
          4
          10
          9
          10
          10
          10
          5
          11
          20
          20
          20
          20
          17
          20
          12
          20
          20
          18
          20
          20
          20
          13
          19
          20
          20
          20
          20
          20
          14
          20
          20
          20
          20
          20
          20
          15
          20
          21
          20
          20
          20
          20
          16
          EOF
          
          # Запускаем программу с входными данными и сохраняем вывод
          echo "=== Запуск программы с тестовыми данными ==="
          cat input.txt | docker run -i --rm myapp-test > output.txt
          
          # Показываем вывод программы
          echo "=== Вывод программы ==="
          cat output.txt
          
          # Проверяем, что программа завершилась успешно
          echo "=== Тест завершен ==="
