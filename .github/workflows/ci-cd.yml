name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]

jobs:
  test-docker:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Build Docker image
        run: docker build -t myapp-test .
      
      - name: Run container
        run: docker run --rm myapp-test --test
